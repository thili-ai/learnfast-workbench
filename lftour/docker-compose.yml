# Learn Fast — AI Tour workbench.
#
#   docker compose -f lftour/docker-compose.yml up
#
# Then open http://127.0.0.1:8889/?token=learnfast
# Your notebooks live in work/ at the repo root — the container sees it as /home/learnfast/work.
#
# The first build downloads about 5 GB (the Jupyter base image, PyTorch and the libraries). Some lessons
# also download small models the first time they run, so keep a network connection.
# No API keys are needed. Two lessons offer an optional live call with a free-tier key of your own; it is
# off by default, and nothing in the lessons requires it.
services:
  workbench:
    # Built locally from ./Dockerfile on first run; nothing is pulled from a registry.
    build: .
    container_name: lftour-workbench
    ports:
      - "8889:8888"
    volumes:
      # Only your own work is mounted. The image ships no course notebooks by design.
      - ../work:/home/learnfast/work
    # Starts as root ONLY so the entrypoint can rename its user to `learnfast` and hand over the
    # home directory; the notebook server itself then drops to that unprivileged user.
    user: root
    environment:
      NB_USER: learnfast
      NB_UID: "1000"
      CHOWN_HOME: "yes"
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-learnfast}
    # Docker Desktop defaults to ~2 GB; the model lessons need more. Give Docker 8 GB or more.
    shm_size: "2gb"
