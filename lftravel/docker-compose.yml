# Learn Fast — Travel desk workbench.
#
#   docker compose -f lftravel/docker-compose.yml up
#
# Then open http://127.0.0.1:8889/?token=learnfast
# Your notebooks live in work/ at the repo root — the container sees it as /home/learnfast/work.
#
# The travel-desk drill (lfdesk) trains a small model on a GPU, so that step runs on Google Colab (a
# free T4 is enough), not in this container. Converting the model to GGUF and serving it use llama.cpp,
# which you install on your own computer. The data generator, the scorer, the guard and the rules around
# the model are plain Python and run here.
# No API keys: everything runs locally.
services:
  workbench:
    # Built locally from ./Dockerfile on first run; nothing is pulled from a registry.
    build: .
    container_name: lftravel-workbench
    ports:
      - "8889:8888"
    volumes:
      # Only your own work is mounted. The image ships no course notebooks by design.
      - ../work:/home/learnfast/work
    # Starts as root ONLY so the entrypoint can rename its user to `learnfast` and hand over the
    # home directory; the notebook server itself then drops to that unprivileged user.
    user: root
    environment:
      NB_USER: learnfast
      NB_UID: "1000"
      CHOWN_HOME: "yes"
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-learnfast}
    shm_size: "2gb"
