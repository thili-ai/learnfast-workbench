# Learn Fast — Agent Infrastructure workbench.
#
#   docker compose -f lfagentinfra/docker-compose.yml up
#
# Then open http://127.0.0.1:8889/?token=learnfast
# Your notebooks live in work/ at the repo root — the container sees it as /home/learnfast/work.
#
# This track needs an API key: copy .env.example to .env at the repo root and add
# ANTHROPIC_API_KEY (lesson 1's main exercise, lesson 7, and the lfa2a/lforchestrate agents all
# need it). OPENAI_API_KEY is optional — only lesson 1's "other providers" bonus section uses it.
services:
  workbench:
    # Pulls the published image if it exists; otherwise builds it locally from ./Dockerfile.
    image: ghcr.io/thili-ai/learnfast-workbench-lfagentinfra:0.1
    build: .
    container_name: lfagentinfra-workbench
    ports:
      - "8889:8888"
      - "8000:8000"   # the MCP server's HTTP/SSE transport (lesson 6), reachable from your own terminal
    volumes:
      # Only your own work is mounted. The image ships no course notebooks by design.
      - ../work:/home/learnfast/work
    env_file:
      - ../.env
    # Starts as root ONLY so the entrypoint can rename its user to `learnfast` and hand over the
    # home directory; the notebook server itself then drops to that unprivileged user.
    user: root
    environment:
      NB_USER: learnfast
      NB_UID: "1000"
      CHOWN_HOME: "yes"
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-learnfast}
    shm_size: "2gb"
